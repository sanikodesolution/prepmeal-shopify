<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 680" width="800" height="680" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F3F3F1"/>
      <stop offset="1" stop-color="#DEDEDA"/>
    </linearGradient>
    <clipPath id="card-clip"><rect width="480" height="300" rx="18"/></clipPath>
    <filter id="blur" x="-20%" y="-50%" width="140%" height="200%"><feGaussianBlur stdDeviation="10"/></filter>
  </defs>

  <rect width="800" height="680" rx="20" fill="url(#bg)"/>

  <!-- soft floor shadow -->
  <ellipse cx="400" cy="520" rx="230" ry="14" fill="#000" opacity="0.22" filter="url(#blur)"/>

  <!-- tilted card -->
  <g transform="translate(400 330) rotate(-7) translate(-240 -150)">
    <rect x="4" y="10" width="480" height="300" rx="18" fill="#000" opacity="0.12" filter="url(#blur)"/>
    <rect width="480" height="300" rx="18" fill="#FFFDF6"/>

    <g clip-path="url(#card-clip)">
      <!-- ribbon band -->
      <polygon points="340,0 392,0 480,88 480,140" fill="#14213D"/>
      <polygon points="352,0 362,0 480,118 480,128" fill="#F5A623" opacity="0.9"/>
    </g>

    <!-- bow -->
    <g transform="translate(423 57)">
      <path d="M0 0 C-10 -46 -56 -40 -48 -6 C-44 8 -14 8 0 0Z" fill="#F5A623"/>
      <path d="M0 0 C46 -10 40 -56 6 -48 C-8 -44 -8 -14 0 0Z" fill="#E8941A"/>
      <path d="M0 0 C10 46 56 40 48 6 C44 -8 14 -8 0 0Z" fill="#E8941A"/>
      <path d="M0 0 C-46 10 -40 56 -6 48 C8 44 8 14 0 0Z" fill="#F5A623"/>
      <rect x="-13" y="-13" width="26" height="26" rx="6" fill="#FFC85C" transform="rotate(45)"/>
    </g>

    <!-- logo badge -->
    <circle cx="62" cy="62" r="26" fill="#F5A623" stroke="#14213D" stroke-width="3"/>
    <text x="62" y="70" text-anchor="middle" font-family="sans-serif" font-weight="800" font-size="22" fill="#14213D">CM</text>
    <text x="98" y="58" font-family="sans-serif" font-weight="700" font-size="15" letter-spacing="3" fill="#14213D">MEALS</text>
    <text x="98" y="76" font-family="sans-serif" font-size="14" letter-spacing="2" fill="#7A8194">FRESH MEAL PREP</text>

    <!-- Gift Card text -->
    <text x="36" y="188" font-family="sans-serif" font-weight="800" font-size="84" letter-spacing="-2" fill="#14213D">Gift</text>
    <text x="36" y="252" font-family="sans-serif" font-weight="400" font-size="62" fill="#F5A623">Card</text>

    <text x="444" y="276" text-anchor="end" font-family="sans-serif" font-size="14" fill="#7A8194">Redeemable on any meal plan</text>
  </g>
</svg>
